{% extends "base.html" %}
{% block body %}
<form method="post" action="/login" class="card pad stack" autocomplete="on">
  <div class="receipt-icon" aria-hidden="true" style="align-self: center">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h2 style="font-size: 19px; text-align: center">ใส่รหัสเข้าใช้งาน</h2>
  {% if message %}
  <div class="callout danger" role="alert">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
    <span>{{ message }}</span>
  </div>
  {% endif %}
  <div class="field">
    <label for="code">รหัส</label>
    <input type="password" id="code" name="code" class="input" autocomplete="current-password"
           autocapitalize="off" spellcheck="false" required autofocus>
  </div>
  <button type="submit" class="btn btn-primary">เข้าใช้งาน</button>
  <div class="hint" style="text-align: center">ขอรหัสได้จากผู้ดูแลระบบของคลินิก</div>
</form>
{% endblock %}

{% extends "base.html" %}
{% block heading %}เลือกหน้าที่จะบันทึก{% endblock %}
{% block body %}
<div class="card">
  <p style="margin-top:0">
    ไฟล์ <strong>{{ workbook_title }}</strong> ยังไม่ได้ตั้งค่าหน้าสำหรับ
    <strong>{{ fund }}</strong> เลือกหน้าที่ต้องการหนึ่งครั้ง
    แล้วระบบจะจำไว้ให้
  </p>
  <form method="post" action="/preview">
    <input type="hidden" name="fund" value="{{ fund }}">
    <input type="hidden" name="workbook_id" value="{{ workbook_id }}">
    <input type="hidden" name="entry_date" value="{{ entry_date }}">
    <input type="hidden" name="description" value="{{ description }}">
    <input type="hidden" name="amount" value="{{ amount }}">
    <input type="hidden" name="requester" value="{{ requester }}">
    <input type="hidden" name="note" value="{{ note }}">
    <label for="page">หน้า</label>
    <select id="page" name="page">
      {% for c in candidates %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>
    <button type="submit">ต่อไป</button>
  </form>
</div>
<div class="foot"><a href="/">ย้อนกลับ</a></div>
{% endblock %}
